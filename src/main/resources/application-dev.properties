# Development Profile: In-Memory H2 Database (No MySQL installation required)
spring.application.name=battle-arena-dev
server.port=${PORT:8080}

spring.datasource.url=jdbc:h2:mem:battlearena_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 Console (available at /h2-console during dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
app.jwt.secret=${JWT_SECRET:battle-arena-super-secure-jwt-secret-key-2026-minimum-256-bits-for-hmac-sha256}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

logging.level.org.springframework.security=WARN
logging.level.com.battlearena=INFO
