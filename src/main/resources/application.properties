spring.application.name=battle-arena
server.port=${PORT:8080}

# Database Configuration (MySQL 8.0 with dynamic cloud environment variable injection)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/battle_arena?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pooling (HikariCP)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:15}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:3}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT Configuration (minimum 256-bit secret for HMAC-SHA256)
app.jwt.secret=${JWT_SECRET:battle-arena-super-secure-jwt-secret-key-2026-minimum-256-bits-for-hmac-sha256}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Production Logging
logging.level.org.springframework.security=WARN
logging.level.com.battlearena=INFO
