spring.application.name=battle-arena
server.port=8080

# Database Configuration (MySQL 8.0)
spring.datasource.url=jdbc:mysql://localhost:3306/battle_arena?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT Configuration (minimum 256-bit secret for HMAC-SHA256)
app.jwt.secret=battle-arena-super-secure-jwt-secret-key-2026-minimum-256-bits-for-hmac-sha256
app.jwt.expiration-ms=86400000

# Logging
logging.level.org.springframework.security=DEBUG
