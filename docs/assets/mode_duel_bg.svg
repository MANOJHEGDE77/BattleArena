<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <radialGradient id="duelGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#F45B69" stop-opacity="0.22"/>
      <stop offset="40%" stop-color="#17C8F3" stop-opacity="0.12"/>
      <stop offset="80%" stop-color="#101722" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#080B12" stop-opacity="0.98"/>
    </radialGradient>
    <linearGradient id="duelBeamLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17C8F3" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#17C8F3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="duelBeamRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F45B69" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F45B69" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="#080B12"/>
  <rect width="400" height="240" fill="url(#duelGlow)"/>
  <!-- Duel Perspective Arena Corridor -->
  <polygon points="50,0 350,0 260,240 140,240" fill="#0f1826" opacity="0.6"/>
  <line x1="50" y1="0" x2="140" y2="240" stroke="#17C8F3" stroke-width="1.5" opacity="0.4"/>
  <line x1="350" y1="0" x2="260" y2="240" stroke="#F45B69" stroke-width="1.5" opacity="0.4"/>
  <line x1="140" y1="240" x2="260" y2="240" stroke="#F3A74B" stroke-width="1.5" opacity="0.3"/>
  <!-- Confrontation Beams & Clash Center -->
  <line x1="40" y1="30" x2="200" y2="120" stroke="url(#duelBeamLeft)" stroke-width="2.5"/>
  <line x1="360" y1="30" x2="200" y2="120" stroke="url(#duelBeamRight)" stroke-width="2.5"/>
  <!-- Clash Impact Target Reticle -->
  <circle cx="200" cy="120" r="14" fill="none" stroke="#F4F7FC" stroke-width="1.8" opacity="0.8"/>
  <circle cx="200" cy="120" r="28" fill="none" stroke="#F45B69" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
  <circle cx="200" cy="120" r="4" fill="#F4F7FC"/>
  <!-- Crosshairs -->
  <line x1="180" y1="120" x2="220" y2="120" stroke="#F4F7FC" stroke-width="1" opacity="0.7"/>
  <line x1="200" y1="100" x2="200" y2="140" stroke="#F4F7FC" stroke-width="1" opacity="0.7"/>
</svg>
