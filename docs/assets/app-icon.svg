<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#101726" />
      <stop offset="65%" stop-color="#080B12" />
      <stop offset="100%" stop-color="#030508" />
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#17C8F3" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00D6A3" />
      <stop offset="100%" stop-color="#17C8F3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Background -->
  <rect width="512" height="512" rx="104" fill="url(#bgGlow)" />

  <!-- Outer Neon Tactical Shield Ring -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="rgba(23, 200, 243, 0.25)" stroke-width="3" />
  <rect x="36" y="36" width="440" height="440" rx="76" fill="none" stroke="rgba(0, 214, 163, 0.15)" stroke-width="1.5" stroke-dasharray="16 10" />

  <!-- Corner Tactical Brackets -->
  <path d="M 50 90 L 50 50 L 90 50" fill="none" stroke="#17C8F3" stroke-width="4" />
  <path d="M 462 90 L 462 50 L 422 50" fill="none" stroke="#17C8F3" stroke-width="4" />
  <path d="M 50 422 L 50 462 L 90 462" fill="none" stroke="#17C8F3" stroke-width="4" />
  <path d="M 462 422 L 462 462 L 422 462" fill="none" stroke="#17C8F3" stroke-width="4" />

  <!-- Center Combat Operator Chassis Insignia -->
  <g transform="translate(256, 236)" filter="url(#glow)">
    <!-- Hexagonal Defensive Aegis -->
    <polygon points="0,-130 112,-65 112,65 0,130 -112,65 -112,-65" fill="rgba(23, 200, 243, 0.08)" stroke="#17C8F3" stroke-width="5" />
    
    <!-- Fighter Ship Geometry -->
    <path d="M 0 -85 L 68 70 L 32 55 L 0 78 L -32 55 L -68 70 Z" fill="rgba(0, 214, 163, 0.2)" stroke="#00D6A3" stroke-width="4" />
    <path d="M 0 -70 L 42 45 L 0 20 L -42 45 Z" fill="url(#cyanGrad)" />

    <!-- Central Energy Reactor Core -->
    <circle cx="0" cy="0" r="18" fill="#ffffff" />
    <circle cx="0" cy="0" r="28" fill="none" stroke="#00f2fe" stroke-width="3" opacity="0.8" />

    <!-- Plasma Thruster Trails -->
    <circle cx="-16" cy="72" r="5" fill="#00D6A3" opacity="0.9" />
    <circle cx="16" cy="72" r="5" fill="#00D6A3" opacity="0.9" />
    <circle cx="-16" cy="90" r="3" fill="#17C8F3" opacity="0.6" />
    <circle cx="16" cy="90" r="3" fill="#17C8F3" opacity="0.6" />
  </g>

  <!-- Tactical App Badge -->
  <g transform="translate(256, 435)">
    <rect x="-105" y="-18" width="210" height="36" rx="18" fill="rgba(23, 200, 243, 0.12)" stroke="#17C8F3" stroke-width="2" />
    <text x="0" y="6" text-anchor="middle" font-family="'Orbitron', 'Arial Black', sans-serif" font-weight="900" font-size="16" fill="#17C8F3" letter-spacing="3">CYBER ARENA</text>
  </g>
</svg>