version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: battle-arena-db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: battle_arena
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: battle-arena-server
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      PORT: ${PORT:-8080}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/battle_arena?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: battle-arena-super-secure-jwt-secret-key-2026-minimum-256-bits-for-hmac-sha256
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
    driver: local
